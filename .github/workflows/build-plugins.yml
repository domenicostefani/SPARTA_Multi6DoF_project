name: Build SPARTA MCFX 6DoF Plugins

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-13]
    runs-on: ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Setup VST2 SDK
      shell: bash
      run: |
        cd SDKs
        curl -L -o vstsdk.zip "https://web.archive.org/web/20181016150224if_/https://download.steinberg.net/sdk_downloads/vstsdk3610_11_06_2018_build_37.zip"
        unzip -q vstsdk.zip || true
        if [ -d "VST_SDK/VST2_SDK" ]; then
          mv VST_SDK/VST2_SDK VST2_SDK_tmp
          rm -rf VST2_SDK
          mv VST2_SDK_tmp VST2_SDK
        fi
        
    - name: Setup SAF Dependencies
      shell: bash
      run: |
        cd SDKs/Spatial_Audio_Framework
        curl -L -o dependencies.zip https://github.com/leomccormack/Spatial_Audio_Framework/releases/download/v1.3.0/dependencies.zip
        unzip -q dependencies.zip
        
    - name: Setup MSVC
      if: matrix.os == 'windows-latest'
      uses: ilammy/msvc-dev-cmd@v1
      
    - name: Setup FFTW3 (Windows)
      if: matrix.os == 'windows-latest'
      shell: cmd
      run: |
        curl -L -o fftw.zip http://www.fftw.org/pub/fftw/fftw-3.3.5-dll64.zip
        mkdir fftw3
        cd fftw3
        tar -xf ..\fftw.zip
        lib /machine:x64 /def:libfftw3f-3.def /out:fftw3f.lib
        lib /machine:x64 /def:libfftw3-3.def /out:fftw3.lib
        
    - name: Setup Intel MKL (Windows)
      if: matrix.os == 'windows-latest'
      shell: bash
      run: |
        python -m pip install mkl-devel mkl-include
        MKL_ROOT=$(python -c "import sysconfig; print(sysconfig.get_paths()['data'].replace(chr(92), '/'))")
        echo "MKL_HEADER_PATH=$MKL_ROOT/Library/include" >> $GITHUB_ENV
        echo "MKL_LIB=$MKL_ROOT/Library/lib/mkl_rt.lib" >> $GITHUB_ENV

    - name: Install Ninja (Mac)
      if: matrix.os == 'macos-13'
      run: brew install ninja

    - name: Configure CMake (Windows)
      if: matrix.os == 'windows-latest'
      shell: bash
      run: >
        cmake -B build
        -G Ninja
        -DCMAKE_BUILD_TYPE=Release
        -DFFTW3_ROOT_DIR="${{ github.workspace }}/fftw3"
        -DINTEL_MKL_HEADER_PATH="${{ env.MKL_HEADER_PATH }}"
        -DINTEL_MKL_LIB="${{ env.MKL_LIB }}"
        -DSAF_ENABLE_SOFA_READER_MODULE=ON
        
    - name: Configure CMake (Mac)
      if: matrix.os == 'macos-13'
      shell: bash
      run: >
        cmake -B build
        -G Ninja
        -DCMAKE_BUILD_TYPE=Release
        -DSAF_ENABLE_SOFA_READER_MODULE=ON
        -DCMAKE_OSX_ARCHITECTURES="x86_64"
        
    - name: Build VST2 and VST3
      run: cmake --build build --config Release --target sparta_MCFX-6DoFconv_VST --target sparta_MCFX-6DoFconv_VST3
      
    - name: Upload Artifacts (Windows)
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: plugin-windows
        path: |
          build/audio_plugins/_SPARTA_MCFX-6DoFconv_/*_artefacts/Release/VST/*.dll
          build/audio_plugins/_SPARTA_MCFX-6DoFconv_/*_artefacts/Release/VST3/*.vst3
          
    - name: Upload Artifacts (Mac)
      if: matrix.os == 'macos-13'
      uses: actions/upload-artifact@v4
      with:
        name: plugin-mac
        path: |
          build/audio_plugins/_SPARTA_MCFX-6DoFconv_/*_artefacts/Release/VST/*.vst
          build/audio_plugins/_SPARTA_MCFX-6DoFconv_/*_artefacts/Release/VST3/*.vst3

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: plugins

      - name: Zip into a single bundle
        run: |
          cd plugins
          zip -r ../SPARTA_MCFX-6DoFconv_Plugins.zip .

      - name: Upload final bundle
        uses: actions/upload-artifact@v4
        with:
          name: SPARTA_MCFX-6DoFconv_Plugins
          path: SPARTA_MCFX-6DoFconv_Plugins.zip
