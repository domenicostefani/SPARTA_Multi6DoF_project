name: Build SPARTA MCFX 6DoF for Windows

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Setup VST2 SDK
      shell: bash
      run: |
        cd SDKs
        unzip -q vstsdk3610_11_06_2018_build_37.zip || true
        # If the zip extracts as VST_SDK/VST2_SDK, rename it to VST2_SDK
        if [ -d "VST_SDK/VST2_SDK" ]; then
          mv VST_SDK/VST2_SDK VST2_SDK_tmp
          rm -rf VST2_SDK
          mv VST2_SDK_tmp VST2_SDK
        fi
        
    - name: Configure CMake
      run: >
        cmake -B build
        -G "Visual Studio 17 2022" -A x64
        -DCMAKE_BUILD_TYPE=Release
        
    - name: Build
      run: cmake --build build --config Release --target sparta_MCFX-6DoFconv_VST
      
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SPARTA_MCFX-6DoFconv_Windows_VST2
        path: build/audio_plugins/_SPARTA_MCFX-6DoFconv_/*_VST/*.dll
