name: Build SPARTA MCFX 6DoF for Windows

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Setup VST2 SDK
      shell: bash
      run: |
        cd SDKs
        curl -L -o vstsdk.zip "https://web.archive.org/web/20181016150224if_/https://download.steinberg.net/sdk_downloads/vstsdk3610_11_06_2018_build_37.zip"
        unzip -q vstsdk.zip || true
        # If the zip extracts as VST_SDK/VST2_SDK, rename it to VST2_SDK
        if [ -d "VST_SDK/VST2_SDK" ]; then
          mv VST_SDK/VST2_SDK VST2_SDK_tmp
          rm -rf VST2_SDK
          mv VST2_SDK_tmp VST2_SDK
        fi
        
    - name: Setup SAF Dependencies
      shell: bash
      run: |
        cd SDKs/Spatial_Audio_Framework
        curl -L -o dependencies.zip https://github.com/leomccormack/Spatial_Audio_Framework/releases/download/v1.3.0/dependencies.zip
        unzip -q dependencies.zip
        
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      
    - name: Setup FFTW3
      shell: cmd
      run: |
        curl -L -o fftw.zip http://www.fftw.org/pub/fftw/fftw-3.3.5-dll64.zip
        mkdir fftw3
        cd fftw3
        tar -xf ..\fftw.zip
        lib /machine:x64 /def:libfftw3f-3.def /out:fftw3f.lib
        lib /machine:x64 /def:libfftw3-3.def /out:fftw3.lib
        
    - name: Configure CMake
      shell: bash
      run: >
        cmake -B build
        -G Ninja
        -DCMAKE_BUILD_TYPE=Release
        -DFFTW3_ROOT_DIR="${{ github.workspace }}/fftw3"
        
    - name: Build
      run: cmake --build build --config Release --target sparta_MCFX-6DoFconv_VST
      
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SPARTA_MCFX-6DoFconv_Windows_VST2
        path: build/audio_plugins/_SPARTA_MCFX-6DoFconv_/*_VST/*.dll
